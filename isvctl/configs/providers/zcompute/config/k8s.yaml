# zcompute EKS-D Kubernetes Validation Configuration
#
# Targets a pre-deployed EKS-D (Amazon EKS Distro) v1.35.2 cluster on zcompute.
# The cluster is static — setup/teardown scripts query it, they do not provision it.
#
# Cluster topology:
#   - 1 control-plane node  (eksd)
#   - 2 CPU worker nodes    (eksd-worker-0, eksd-worker-1)
#   - 2 GPU worker nodes    (eksd-gpu-worke-0, eksd-gpu-worker-1, 8× H100 SXM5 80GB each)
#
# GPU Operator: zadara-system namespace (deployed via zadara-vm-chart), driver 575.57.08
# Storage:      ebs-sc (block, ebs.csi.aws.com — zcompute AWS-compatible EBS)
# CNI:          Cilium
#
# Usage:
#   export KUBECONFIG=path/to/config-eksd-<cluster-name>
#   export PYTHONPATH=isvctl/src:isvtest/src:isvreporter/src
#   uv run isvctl test run -f isvctl/configs/providers/zcompute/config/k8s.yaml -v
#
# Optional (to enable NIM tests):
#   export NGC_API_KEY=<your_key>

import:
  - ../../../suites/k8s.yaml

version: "1.0"

commands:
  kubernetes:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: setup
        phase: setup
        command: "../scripts/k8s/setup.sh"
        output_schema: cluster
        timeout: 120

      - name: create_test_node_pool
        phase: setup
        command: "../scripts/k8s/create_node_pool.sh"
        output_schema: node_pool
        timeout: 60
        env:
          TF_VAR_test_pool_name: "isv-test-pool"
          TF_VAR_test_pool_instance_types: '["m6i.large"]'
          TF_VAR_test_pool_desired_size: "1"
          TF_VAR_test_pool_labels_json: '{"isv.ncp.validation/workload":"data-ingest"}'
          TF_VAR_test_pool_taints_json: '[{"key":"isv.ncp.validation/dedicated","value":"test","effect":"NoSchedule"}]'
          TF_VAR_test_pool_node_type: "cpu"

      - name: update_test_node_pool
        phase: test
        command: "../scripts/k8s/create_node_pool.sh"
        output_schema: node_pool
        timeout: 60
        env:
          NODE_POOL_ACTION: "Updating"
          TF_VAR_test_pool_name: "isv-test-pool"
          TF_VAR_test_pool_instance_types: '["m6i.large"]'
          TF_VAR_test_pool_desired_size: "2"
          TF_VAR_test_pool_labels_json: '{"isv.ncp.validation/workload":"data-ingest"}'
          TF_VAR_test_pool_taints_json: '[{"key":"isv.ncp.validation/dedicated","value":"test","effect":"NoSchedule"}]'
          TF_VAR_test_pool_node_type: "cpu"

      - name: pre_test_cleanup
        phase: test
        command: "../scripts/k8s/pre_test_cleanup.sh"
        timeout: 30
        # Deletes Completed/Failed pods that hold nvidia.com/gpu resources permanently:
        #   - nvidia-cuda-validator-* in zadara-system (GPU Operator init pods, never auto-GC'd)
        #   - Any stale isvtest-* / NCCL / NIM pods from previous/interrupted runs
        # Without this, NCCL and GPU stress workloads cannot acquire 8 GPUs per node.

      - name: destroy_test_node_pool
        phase: teardown
        command: "../scripts/k8s/destroy_node_pool.sh"
        timeout: 60

      - name: teardown
        phase: teardown
        command: "../scripts/k8s/teardown.sh"
        timeout: 60

tests:
  description: "zcompute EKS-D GPU cluster validation (K8s v1.35.2, 2× 8× H100 SXM5)"

  validations:
    k8s_workloads:
      checks:
        K8sNcclMultiNodeWorkload:
          # MNNVL root cause found and fixed at the host level (2026-08-05).
          # Two earlier attempts crashed identically with "Cuda failure 801
          # 'operation not supported'" in transport/p2p.cc regardless of NCCL
          # version (2.25.1 vs 2.30.7) or net plugin (HPC-X SHARP vs NCCL's own
          # built-in IB) - always on the cross-node rank pairs specifically,
          # never the intra-node ones. Root cause: the nvidia-imex systemd
          # service on worker-node-0/worker-node-1 was present but dead -
          # /etc/nvidia-imex/nodes_config.cfg was 0 bytes (empty), so the
          # daemon started, found no fabric peers configured, and exited
          # clean every time (a prior "99-no-crashloop.conf" drop-in had
          # disabled its auto-restart rather than fixing the empty config).
          # Populated nodes_config.cfg with both nodes' IPs (7.243.41.31,
          # 7.243.41.33) on both hosts; worker-node-1 additionally needed
          # NETWORK_INTERFACE=enP6p3s0np0 pinned in config.cfg because that IP
          # was ambiguously bound to two interfaces (the real NIC and a wg0
          # WireGuard tunnel). `sudo nvidia-imex-ctl -q` now reports READY on
          # both nodes. This is a host/OS-level fix (systemd + config files
          # under /etc/nvidia-imex/), not anything in this repo - re-running
          # this suite from scratch on a freshly provisioned node will need
          # the same fix repeated unless it's folded into cluster setup.
          # First real MNNVL passing run measured 674.60 GB/s peak / 184.62 GB/s
          # avg (2026-08-05, MPIJob nccl-allreduce-mn-229abecb) - beats Anton's
          # 660 GB/s reference point on equivalent hardware. Raised
          # min_bus_bw_gbps to 500 (comfortable margin below the measured
          # peak, matching this repo's existing margin convention - e.g. 454
          # measured -> 350 threshold for the old NVLS/RoCE combo).
          min_bus_bw_gbps: 500
          # Workers take 3-4 min to start (GPU device plugin reclaims resources from the
          # just-completed single-node NCCL pod) + ~80s for apt-get install openssh-server.
          # Default 300s is not enough; 600s covers the full startup window comfortably.
          startup_timeout: 600
          mnnvl_enable: true
          nvls_enable: false

        K8sGpuStressWorkload:
          # gpu-worker-1 runs after NCCL; GPU device plugin needs extra time to reclaim.
          # Default 300s is too tight — raise to 600s.
          timeout: 600

        K8sNimHelmWorkload-1b:
          # Same PVC gap as K8sNimInferenceWorkload below (confirmed 2026-08-05:
          # model-store PVC stuck Pending, "ProvisioningFailed: no topology key
          # found on CSINode <node>" on ebs-sc/ebs.csi.aws.com) - use an ephemeral
          # emptyDir instead so the pod actually schedules.
          use_pvc_cache: false

        K8sNimHelmWorkload-3b:
          # Override suite default (gpu_per_node=8) — NIM 3b with 8× H100 on zCompute
          # tries tensor parallelism which fails (engine profile not found or NVLink/IMEX
          # initialization issue). Single-GPU deployment works correctly on H100 SXM5 80GB.
          gpu_count: 1
          # Same PVC gap as K8sNimHelmWorkload-1b above.
          use_pvc_cache: false

        K8sNimInferenceWorkload:
          # aws-cloud-controller-manager is crashing and ebs-csi-node is in
          # CrashLoopBackOff on this EKS-D cluster (same gap as the excluded
          # CSI/PVC checks below) - the nim-model-cache PVC never binds
          # (confirmed 2026-08-05: stuck Pending on ebs-sc). The PVC only
          # caches downloaded model weights across pod restarts, which
          # doesn't matter for a single validation run - use an ephemeral
          # emptyDir instead so the check actually exercises real NIM
          # inference on this cluster.
          use_pvc_cache: false

    kubernetes:
      checks:
        K8sNodeCountCheck:
          count: "{{ steps.setup.kubernetes.node_count | default(4, true) }}"
        # expected_per_node/expected_total intentionally left unset here -
        # inherits the base suite's auto-detected steps.setup.kubernetes.
        # gpu_per_node/total_gpus (now correctly computed by _common.sh,
        # 2026-08-05: 4 per node / 8 total on this cluster's real GPU
        # workers, excluding the tainted GPU-less control-plane node).
        # A hardcoded 8/16 here previously shadowed that auto-detection
        # entirely and never matched the real hardware.
        K8sMigConfigCheck:
          require_mig: false
          expected_labels:
            "nvidia.com/mig.capable": "true"
            "nvidia.com/mig.strategy": "single"

    k8s_network:
      checks:
        K8sApiNetworkAclCheck:
          # Real external vantage point (2026-08-05): 172.30.8.71 is a VM
          # with no route/allow-list entry to the API server, reachable via
          # SSH from the manager VM this suite runs on. sshpass supplies the
          # password non-interactively; ACL_PROBE_VM_PASSWORD must be
          # exported in the environment running isvctl (kept out of this
          # committed file on purpose - do not hardcode it here).
          # Deliberately a literal $VAR (shell expansion at command execution),
          # NOT a Jinja {{ env.X }} expression - isvctl's redaction.py strips
          # any env var ending in a sensitive suffix like _PASSWORD from the
          # Jinja `env` context before templates render, so {{ env.X }} would
          # never see it. A plain $VAR is expanded by the shell subprocess
          # itself, after config templating has already finished.
          commands:
            unauthorized_probe: >-
              sshpass -p "$ACL_PROBE_VM_PASSWORD" ssh
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
              -o ConnectTimeout=5 ubuntu@172.30.8.71
              "curl --max-time 5 -sk https://172.28.12.196:6443/readyz"
          api_endpoint: "https://172.28.12.196:6443"

  exclude:
    tests:
      # Static cluster — no managed node pool API
      - K8sNodePoolCheck

      # CNCF conformance is a long-running suite (hours) — run separately
      - K8sCncfConformanceCheck

      # aws-cloud-controller-manager is crashing and ebs-csi-node is in
      # CrashLoopBackOff on this EKS-D cluster - expected, since these
      # bare-metal nodes aren't connected to cloud block storage, so the
      # cloud controllers can't function here. These three checks all depend
      # on CSI/PVC provisioning. Confirmed acceptable to exclude with
      # Oren Kisler and Eyal Cohen (Slack, 2026-08-05) - equivalent results
      # were already uploaded from the HGX lab (which has the storage
      # subsystem); this gap will be raised with NVIDIA directly rather than
      # worked around here.
      - K8sCsiStorageTypesCheck
      - K8sCsiStorageQuotaApiCheck
      - K8sCsiProvisioningModesCheck

      # NIM workloads enabled — requires NGC_API_KEY to be set in environment

      # K8sGpuStressWorkload is NOT excluded but requires the pytorch image to be
      # pre-pulled on both GPU nodes (see CLUSTER-SETUP.md §12). The pre-pull
      # DaemonSet must remain running during the test suite — do NOT delete it
      # before the suite completes. If the workload still fails with empty logs,
      # check CuPy availability: kubectl run cupy-check --rm -i --restart=Never
      #   --image=nvcr.io/nvidia/pytorch:25.04-py3 -n default
      #   --overrides='{"spec":{"nodeSelector":{"nvidia.com/gpu.present":"true"},
      #     "tolerations":[{"operator":"Exists"}],"runtimeClassName":"nvidia",
      #     "containers":[{"name":"t","image":"nvcr.io/nvidia/pytorch:25.04-py3",
      #     "command":["python3","-c","import cupy; print(cupy.__version__)"],
      #     "resources":{"limits":{"nvidia.com/gpu":"1"}}}]}}'
